name: Deploy to LWS

on:
  push:
    branches:
      - main
      - 2-juin
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Kle Gemini an PA nan git (keys.local.js gitignored). Nou kreye l isit
      # la depi yon GitHub Secret pou li deplwaye san janm antre nan repo a.
      - name: Kreye keys.local.js depi secret
        run: |
          printf 'window.GEMINI_API_KEY = "%s";\n' "${{ secrets.GEMINI_KEY }}" > keys.local.js

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            functions/**
            dev_tools/**
            **/*.md
            serve.ps1
            server.js
            served_main.js
            temp_*.py
            firebase.json
            .firebaserc
            firestore.rules
            firestore.indexes.json
            keys.example.js
